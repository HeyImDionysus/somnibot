appId: com.somnibot.launcher
productName: SomniBot
copyright: Copyright © 2026 SomniBot

directories:
  output: release
  buildResources: build

# Launcher's own files go into the asar.
# Production node_modules (electron-store, electron-updater) are included
# automatically by electron-builder — no need to list them.
files:
  - dist/**/*
  - src/renderer/**/*
  - package.json

# Bot and dashboard are staged into .resources/ by the build script
# (scripts/build-launcher.mjs) before electron-builder runs.
extraResources:
  - from: .resources/bot
    to: bot
    filter:
      - "**/*"
  - from: .resources/dashboard
    to: dashboard
    filter:
      - "**/*"
  - from: .resources/supabase
    to: supabase
    filter:
      - "**/*"

win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.ico

mac:
  target:
    - target: dmg
      arch: [x64, arm64]
  icon: build/icon.icns
  category: public.app-category.utilities

linux:
  target:
    - target: AppImage
      arch: [x64]
  icon: build/icon.png
  category: Utility

nsis:
  oneClick: true
  perMachine: false
  allowToChangeInstallationDirectory: false

publish:
  provider: github
  owner: HeyImDionysus
  repo: somnibot
