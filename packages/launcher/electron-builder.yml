appId: com.somnibot.launcher
productName: SomniBot
executableName: SomniBot
copyright: Copyright © 2026 SomniBot

# Keep the pnpm workspace package scoped while giving installer/updater paths a
# filesystem-safe package identity on Windows and Linux.
extraMetadata:
  name: somnibot-launcher
  desktopName: SomniBot
  author:
    name: SomniBot

directories:
  output: release
  buildResources: build

# Launcher's own files go into the asar.
# Production node_modules (electron-store, electron-updater) are included
# automatically by electron-builder — no need to list them.
files:
  - dist/**/*
  - src/renderer/**/*
  - package.json

# Bot and dashboard are staged into .resources/ by the build script
# (scripts/build-launcher.mjs) before electron-builder runs.
extraResources:
  - from: .resources/bot
    to: bot
    filter:
      - "**/*"
      - "!runtime_modules/**/*"
  - from: .resources/bot/runtime_modules
    to: bot/node_modules
    filter:
      - "**/*"
  - from: .resources/dashboard
    to: dashboard
    filter:
      - "**/*"
  - from: .resources/supabase
    to: supabase
    filter:
      - "**/*"

win:
  artifactName: "${productName}-Setup-${version}.${ext}"
  # Windows signing is intentionally optional for this release. Keep resource
  # editing/metadata enabled while producing a verifiably unsigned artifact.
  signExecutable: false
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.ico

linux:
  artifactName: "${productName}-${version}.${ext}"
  target:
    - target: AppImage
      arch: [x64]
  icon: build/icon.png
  category: Utility
  syncDesktopName: true

nsis:
  oneClick: true
  perMachine: false
  allowToChangeInstallationDirectory: false

publish:
  provider: github
  owner: HeyImDionysus
  repo: somnibot
