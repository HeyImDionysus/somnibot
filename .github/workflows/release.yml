name: Build v1 Launcher Release

on:
  push:
    tags:
      - 'v1.0.0'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag. Only v1.0.0 is accepted.'
        default: 'v1.0.0'
        required: true

permissions:
  contents: write
  actions: read

jobs:
  validate-release:
    name: Validate approved green main tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - name: Checkout repository history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve and validate release tag
        id: release
        shell: bash
        env:
          REQUESTED_TAG: ${{ github.event.inputs.tag || github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="$REQUESTED_TAG"
          if [[ "$TAG" != "v1.0.0" ]]; then
            echo "Only the approved v1.0.0 launcher release may be published." >&2
            exit 1
          fi

          git fetch --force --quiet origin main "refs/tags/${TAG}:refs/tags/${TAG}"

          TAG_SHA="$(git rev-parse "${TAG}^{commit}")"
          MAIN_SHA="$(git rev-parse origin/main)"
          if [[ "$TAG_SHA" != "$MAIN_SHA" ]]; then
            echo "${TAG} resolves to ${TAG_SHA}, not the current main SHA ${MAIN_SHA}." >&2
            exit 1
          fi

          GREEN_RUNS="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${TAG_SHA}&branch=main&event=push&status=completed&per_page=100" \
            --jq '[.workflow_runs[] | select(.conclusion == "success")] | length')"
          if [[ "$GREEN_RUNS" == "0" ]]; then
            echo "No successful main CI run exists for ${TAG_SHA}." >&2
            exit 1
          fi

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "sha=${TAG_SHA}" >> "$GITHUB_OUTPUT"

  build:
    needs: validate-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: --win
            artifact: windows
          - os: ubuntu-latest
            platform: --linux
            artifact: linux

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.validate-release.outputs.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build & package
        run: node scripts/build-launcher.mjs ${{ matrix.platform }}
        env:
          RELEASE_SHA: ${{ needs.validate-release.outputs.sha }}

      - name: Validate packaged release contract
        shell: pwsh
        env:
          RELEASE_SHA: ${{ needs.validate-release.outputs.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $releaseDir = 'packages/launcher/release'
          $expectedName = if ('${{ matrix.artifact }}' -eq 'windows') { 'SomniBot-Setup-1.0.0.exe' } else { 'SomniBot-1.0.0.AppImage' }
          $primary = @(Get-ChildItem $releaseDir -File | Where-Object { $_.Name -eq $expectedName })
          if ($primary.Count -ne 1) { throw "Expected exactly one $expectedName artifact, found $($primary.Count)." }
          if (@(Get-ChildItem $releaseDir -File | Where-Object { $_.Name -match '0\.1\.0' }).Count -ne 0) {
            throw 'Stale launcher 0.1.0 output survived into the release directory.'
          }

          $metadataName = if ('${{ matrix.artifact }}' -eq 'windows') { 'latest.yml' } else { 'latest-linux.yml' }
          $metadata = Get-Content (Join-Path $releaseDir $metadataName) -Raw
          if ($metadata -notmatch '(?m)^version:\s*1\.0\.0\s*$') { throw "$metadataName does not advertise version 1.0.0." }
          if ($metadata -notmatch [regex]::Escape($expectedName)) { throw "$metadataName does not advertise $expectedName." }

          $source = Get-Content 'packages/launcher/dist/main/release-source.json' -Raw | ConvertFrom-Json
          if ($source.repositoryRef -ne $env:RELEASE_SHA) { throw 'Embedded release source SHA does not match the validated main tag.' }

      - name: Record Windows Authenticode status (optional)
        if: matrix.artifact == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = @(Get-ChildItem 'packages/launcher/release' -Filter '*.exe' -File)
          if ($installer.Count -ne 1) {
            throw "Expected exactly one NSIS installer, found $($installer.Count)."
          }
          $signature = Get-AuthenticodeSignature -FilePath $installer[0].FullName
          if ($signature.Status -notin @('Valid', 'NotSigned')) {
            throw "Installer has an invalid Authenticode state: $($signature.Status)."
          }
          "WINDOWS_SIGNATURE_STATUS=$($signature.Status)" >> $env:GITHUB_ENV

      - name: Create checksums and provenance
        shell: pwsh
        env:
          RELEASE_TAG: ${{ needs.validate-release.outputs.tag }}
          RELEASE_SHA: ${{ needs.validate-release.outputs.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $releaseDir = 'packages/launcher/release'
          $primaryName = if ('${{ matrix.artifact }}' -eq 'windows') { 'SomniBot-Setup-1.0.0.exe' } else { 'SomniBot-1.0.0.AppImage' }
          $metadataName = if ('${{ matrix.artifact }}' -eq 'windows') { 'latest.yml' } else { 'latest-linux.yml' }
          $files = @(
            Get-Item (Join-Path $releaseDir $primaryName)
            Get-Item (Join-Path $releaseDir $metadataName)
          )

          $checksumName = "SHA256SUMS-${{ matrix.artifact }}"
          $checksumLines = $files | Sort-Object Name | ForEach-Object {
            "$( (Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash.ToLowerInvariant() ) *$($_.Name)"
          }
          [System.IO.File]::WriteAllLines((Join-Path $releaseDir $checksumName), $checksumLines)

          $signingStatus = if ('${{ matrix.artifact }}' -eq 'windows') { $env:WINDOWS_SIGNATURE_STATUS } else { 'not-applicable' }
          if ([string]::IsNullOrWhiteSpace($signingStatus)) { $signingStatus = 'NotSigned' }
          $provenance = [ordered]@{
            releaseTag = $env:RELEASE_TAG
            sourceSha = $env:RELEASE_SHA
            platform = '${{ matrix.artifact }}'
            workflowRunId = $env:GITHUB_RUN_ID
            workflowRunAttempt = $env:GITHUB_RUN_ATTEMPT
            createdAtUtc = (Get-Date).ToUniversalTime().ToString('o')
            windowsSigningRequired = $false
            windowsSigningStatus = $signingStatus
            files = @($files | Sort-Object Name | ForEach-Object { $_.Name })
          }
          $provenance | ConvertTo-Json -Depth 4 | Set-Content -NoNewline (Join-Path $releaseDir "provenance-${{ matrix.artifact }}.json")

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: somnibot-${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact == 'windows' && 'packages/launcher/release/*.exe' || 'packages/launcher/release/*.AppImage' }}
            ${{ matrix.artifact == 'windows' && 'packages/launcher/release/latest.yml' || 'packages/launcher/release/latest-linux.yml' }}
            packages/launcher/release/SHA256SUMS-${{ matrix.artifact }}
            packages/launcher/release/provenance-${{ matrix.artifact }}.json
          if-no-files-found: error
          retention-days: 30

  verify-windows-installer:
    needs: [validate-release, build]
    runs-on: windows-latest
    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v5
        with:
          name: somnibot-windows
          path: artifact

      - name: Verify checksum and optional Authenticode status after download
        shell: pwsh
        env:
          RELEASE_TAG: ${{ needs.validate-release.outputs.tag }}
          RELEASE_SHA: ${{ needs.validate-release.outputs.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = @(Get-ChildItem artifact -Filter '*.exe' -File)
          if ($installer.Count -ne 1) { throw "Expected one Windows installer, found $($installer.Count)." }

          $checksum = Get-Content 'artifact/SHA256SUMS-windows' | Where-Object { $_ -match [regex]::Escape("*$($installer[0].Name)") }
          if (@($checksum).Count -ne 1) { throw 'Installer checksum entry is missing or ambiguous.' }
          if ($checksum -notmatch '^([a-fA-F0-9]{64}) \*.+$') { throw 'Installer checksum entry is malformed.' }
          $expectedHash = $Matches[1]
          $actualHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $installer[0].FullName).Hash
          if ($actualHash -ne $expectedHash) { throw 'Downloaded installer checksum does not match.' }

          $signature = Get-AuthenticodeSignature -FilePath $installer[0].FullName
          if ($signature.Status -notin @('Valid', 'NotSigned')) {
            throw "Downloaded installer has an invalid Authenticode state: $($signature.Status)."
          }

          $provenance = Get-Content 'artifact/provenance-windows.json' -Raw | ConvertFrom-Json
          if ($provenance.releaseTag -ne $env:RELEASE_TAG -or $provenance.sourceSha -ne $env:RELEASE_SHA -or $provenance.platform -ne 'windows') {
            throw 'Downloaded Windows provenance is not bound to the validated release candidate.'
          }
          if (@($provenance.files) -notcontains $installer[0].Name) { throw 'Windows provenance does not list the installer.' }

  verify-linux-appimage:
    needs: [validate-release, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download Linux artifact
        uses: actions/download-artifact@v5
        with:
          name: somnibot-linux
          path: artifact

      - name: Verify checksum, version, updater metadata, and provenance after download
        shell: pwsh
        env:
          RELEASE_TAG: ${{ needs.validate-release.outputs.tag }}
          RELEASE_SHA: ${{ needs.validate-release.outputs.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $appImage = @(Get-ChildItem artifact -Filter '*.AppImage' -File)
          if ($appImage.Count -ne 1) { throw "Expected one Linux AppImage, found $($appImage.Count)." }
          if ($appImage[0].Name -ne 'SomniBot-1.0.0.AppImage') { throw "Unexpected Linux artifact name: $($appImage[0].Name)." }

          $checksum = Get-Content 'artifact/SHA256SUMS-linux' | Where-Object { $_ -match [regex]::Escape("*$($appImage[0].Name)") }
          if (@($checksum).Count -ne 1) { throw 'AppImage checksum entry is missing or ambiguous.' }
          if ($checksum -notmatch '^([a-fA-F0-9]{64}) \*.+$') { throw 'AppImage checksum entry is malformed.' }
          $expectedHash = $Matches[1]
          $actualHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $appImage[0].FullName).Hash
          if ($actualHash -ne $expectedHash) { throw 'Downloaded AppImage checksum does not match.' }

          $metadata = Get-Content 'artifact/latest-linux.yml' -Raw
          if ($metadata -notmatch '(?m)^version:\s*1\.0\.0\s*$' -or $metadata -notmatch [regex]::Escape($appImage[0].Name)) {
            throw 'Downloaded Linux updater metadata does not match the AppImage.'
          }
          $provenance = Get-Content 'artifact/provenance-linux.json' -Raw | ConvertFrom-Json
          if ($provenance.releaseTag -ne $env:RELEASE_TAG -or $provenance.sourceSha -ne $env:RELEASE_SHA -or $provenance.platform -ne 'linux') {
            throw 'Downloaded Linux provenance is not bound to the validated release candidate.'
          }
          if (@($provenance.files) -notcontains $appImage[0].Name) { throw 'Linux provenance does not list the AppImage.' }

  release:
    needs: [validate-release, build, verify-windows-installer, verify-linux-appimage]
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.validate-release.outputs.tag }}
          target_commitish: ${{ needs.validate-release.outputs.sha }}
          name: SomniBot ${{ needs.validate-release.outputs.tag }}
          draft: true
          generate_release_notes: true
          files: artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
