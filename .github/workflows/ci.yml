# =============================================================================
# SomniBot — CI Pipeline
# =============================================================================
#
# Jobs (14):
#   install            → dependency cache
#   typecheck           → tsc --noEmit across all packages
#   lint                → ESLint (dashboard)
#   build               → full production build (all packages)
#   test-unit           → bot unit tests + 70% coverage gate
#   test-dashboard      → dashboard unit tests
#   test-shared         → shared package unit tests (V5 Audit §13.6)
#   test-launcher       → launcher unit tests (V5 Audit §13.7)
#   test-integration    → integration tests against local Supabase
#   test-live           → live-stack E2E: REAL bot JS + initGuildFeatures vs local Supabase
#   migration-lint      → migration naming, ordering, dangerous ops
#   db-security-audit   → SECURITY DEFINER search_path + RLS policy audit
#   type-drift          → REQUIRED: fails if the committed DB-type snapshot is stale
#   security            → dependency audit + secret scanning
#   ci-gate             → required status check — all jobs must pass
# =============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "9.15.4"
  # 2.110+ executes CREATE INDEX CONCURRENTLY outside the per-migration
  # transaction, which the online fraud-observation index migration requires.
  SUPABASE_CLI_VERSION: "2.110.0"

# =============================================================================
# Reusable setup anchor — keeps checkout+pnpm+node+cache consistent
# =============================================================================
# (YAML anchors aren't supported in GitHub Actions, so we repeat steps.
#  Each job uses the same 4-step preamble for deterministic setup.)

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # 1. Install & Cache
  # ──────────────────────────────────────────────────────────────────────────
  install:
    name: 📦 Install Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - id: node-modules-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            node_modules
            packages/*/node_modules
          key: node-modules-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache/save@v5
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        with:
          path: |
            node_modules
            packages/*/node_modules
          key: node-modules-${{ hashFiles('pnpm-lock.yaml') }}

  # ──────────────────────────────────────────────────────────────────────────
  # 2. Typecheck — every package with a type-check script
  # ──────────────────────────────────────────────────────────────────────────
  typecheck:
    name: 🔍 Typecheck
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/cache/restore@v5
        with:
          path: |
            node_modules
            packages/*/node_modules
          key: node-modules-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Build shared (dependency for all packages)
        run: pnpm --filter @somnibot/shared build
      - name: Typecheck bot
        run: pnpm --filter @somnibot/bot type-check
      - name: Typecheck dashboard
        run: pnpm --filter @somnibot/dashboard type-check
      - name: Typecheck dashboard tests
        run: pnpm --filter @somnibot/dashboard type-check:test
      - name: Typecheck license-sdk
        run: pnpm --filter @somnibot/license-sdk typecheck

  # ──────────────────────────────────────────────────────────────────────────
  # 3. Lint
  # ──────────────────────────────────────────────────────────────────────────
  lint:
    name: 🧹 Lint
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/cache/restore@v5
        with:
          path: |
            node_modules
            packages/*/node_modules
          key: node-modules-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Build shared
        run: pnpm --filter @somnibot/shared build
      - name: Lint dashboard
        run: pnpm --filter @somnibot/dashboard lint
      - name: Audit test integrity
        run: pnpm --filter @somnibot/dashboard test:integrity

  # ──────────────────────────────────────────────────────────────────────────
  # 4. Build — full production build (validates all packages compile)
  # ──────────────────────────────────────────────────────────────────────────
  build:
    name: 🏗️ Build
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/cache/restore@v5
        with:
          path: |
            node_modules
            packages/*/node_modules
          key: node-modules-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Build all packages
        run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.placeholder
          DISCORD_GUILD_ID: "000000000000000000"

  # ──────────────────────────────────────────────────────────────────────────
  # 5. Unit Tests — bot (vitest + v8 coverage)
  # ──────────────────────────────────────────────────────────────────────────
  test-unit:
    name: 🧪 Unit Tests (Bot)
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/cache/restore@v5
        with:
          path: |
            node_modules
            packages/*/node_modules
          key: node-modules-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Build shared
        run: pnpm --filter @somnibot/shared build
      - name: Run unit tests with coverage
        run: |
          pnpm --filter @somnibot/bot test -- \
            --coverage \
            --coverage.thresholds.statements=70 \
            --coverage.reporter=text \
            --coverage.reporter=json-summary \
            --reporter=verbose
      - name: Upload coverage summary
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage-bot
          path: packages/bot/coverage/
          retention-days: 14

  # ──────────────────────────────────────────────────────────────────────────
  # 6. Dashboard Tests
  # ──────────────────────────────────────────────────────────────────────────
  test-dashboard:
    name: 🧪 Unit Tests (Dashboard)
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/cache/restore@v5
        with:
          path: |
            node_modules
            packages/*/node_modules
          key: node-modules-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Build shared
        run: pnpm --filter @somnibot/shared build
      - name: Run dashboard tests with coverage
        run: |
          pnpm --filter @somnibot/dashboard test -- \
            --coverage \
            --coverage.thresholds.statements=70 \
            --coverage.reporter=text \
            --coverage.reporter=json-summary \
            --reporter=verbose
      - name: Upload coverage summary
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage-dashboard
          path: packages/dashboard/coverage/
          retention-days: 14

  # ──────────────────────────────────────────────────────────────────────────
  # 6b. Shared Package Tests (V5 Audit §13.6)
  # ──────────────────────────────────────────────────────────────────────────
  test-shared:
    name: 🧪 Unit Tests (Shared)
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/cache/restore@v5
        with:
          path: |
            node_modules
            packages/*/node_modules
          key: node-modules-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Build shared
        run: pnpm --filter @somnibot/shared build
      - name: Run shared tests
        run: pnpm --filter @somnibot/shared test --reporter=verbose

  # ──────────────────────────────────────────────────────────────────────────
  # 6c. Launcher Tests (V5 Audit §13.7)
  # ──────────────────────────────────────────────────────────────────────────
  test-launcher:
    name: 🧪 Unit Tests (Launcher)
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/cache/restore@v5
        with:
          path: |
            node_modules
            packages/*/node_modules
          key: node-modules-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Run launcher tests
        run: pnpm --filter @somnibot/launcher test --reporter=verbose

  # ──────────────────────────────────────────────────────────────────────────
  # 6d. E2E Contract Tests
  #     The 46-domain catalog schema is the acceptance contract for the
  #     real-stack proof suites — its validation rules must themselves be
  #     gated, not just compiled by the build job.
  # ──────────────────────────────────────────────────────────────────────────
  test-e2e-contract:
    name: 🧪 Unit Tests (E2E Contract)
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/cache/restore@v5
        with:
          path: |
            node_modules
            packages/*/node_modules
          key: node-modules-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Type-check e2e contract package
        run: pnpm --filter @somnibot/e2e type-check
      - name: Run e2e contract tests
        run: pnpm --filter @somnibot/e2e test --reporter=verbose

  # ──────────────────────────────────────────────────────────────────────────
  # 6e. E2E Testkit (loopback harness) — guard + isolation
  #     testkit drives the REAL production router against a disposable rig, so
  #     its safety guard must be gated AND its production-isolation enforced:
  #     the isolation check fails the build if any shipped source ever imports
  #     it or any production package declares it as a runtime dependency.
  # ──────────────────────────────────────────────────────────────────────────
  test-testkit:
    name: 🧪 Unit Tests (E2E Testkit)
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/cache/restore@v5
        with:
          path: |
            node_modules
            packages/*/node_modules
          key: node-modules-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Assert testkit production isolation
        run: node scripts/check-testkit-isolation.mjs
      # The routing-parity test drives the REAL compiled dispatcher, so bot
      # (and its shared dep) must be built before testkit type-check/tests.
      - name: Build shared + e2e + bot (dispatcher + catalog under test)
        run: |
          pnpm --filter @somnibot/shared build
          pnpm --filter @somnibot/e2e build
          pnpm --filter @somnibot/bot build
      - name: Type-check testkit (source + tests)
        run: |
          pnpm --filter @somnibot/testkit type-check
          pnpm --filter @somnibot/testkit run type-check:test
      - name: Run testkit tests
        run: pnpm --filter @somnibot/testkit test --reporter=verbose

  # ──────────────────────────────────────────────────────────────────────────
  # 7. Integration Tests — real Supabase (full migration stack)
  # ──────────────────────────────────────────────────────────────────────────
  test-integration:
    name: 🔗 Integration Tests
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/cache/restore@v5
        with:
          path: |
            node_modules
            packages/*/node_modules
          key: node-modules-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Supabase CLI
        run: |
          curl -fsSL -o /tmp/supabase.tar.gz \
            "https://github.com/supabase/cli/releases/download/v${SUPABASE_CLI_VERSION}/supabase_linux_amd64.tar.gz"
          tar -xzf /tmp/supabase.tar.gz -C /usr/local/bin
          supabase --version
      - name: Start Supabase local
        run: |
          cd packages
          for attempt in 1 2 3; do
            if supabase start; then
              exit 0
            else
              status=$?
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "supabase start failed after ${attempt} attempts (exit ${status})"
              exit "$status"
            fi

            delay_seconds=$((attempt * 30))
            echo "supabase start failed (attempt ${attempt}/3, exit ${status}); cleaning up and retrying in ${delay_seconds}s..."
            supabase stop 2>/dev/null || true
            sleep "$delay_seconds"
          done
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      - name: Wait for Supabase REST API
        run: |
          echo "Waiting for Supabase REST API..."
          for i in $(seq 1 30); do
            if curl -sf -o /dev/null http://127.0.0.1:54321/rest/v1/ \
              -H "apikey: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU"; then
              echo "✅ Supabase REST API ready (attempt $i)"
              exit 0
            fi
            echo "  attempt $i/30 — waiting..."
            sleep 2
          done
          echo "❌ Supabase REST API did not respond within 60s"
          exit 1
      - name: Build shared
        run: pnpm --filter @somnibot/shared build
      - name: Run integration tests
        run: pnpm --filter @somnibot/bot test:integration --reporter=verbose
        env:
          SUPABASE_URL: http://127.0.0.1:54321
          SUPABASE_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU
      - name: Stop Supabase
        if: always()
        run: cd packages && supabase stop 2>/dev/null || true

  # ──────────────────────────────────────────────────────────────────────────
  # 7b. Live-Stack E2E Lane — the ONLY job that loads the REAL compiled bot JS
  #     and drives the REAL production initGuildFeatures against a local
  #     Supabase (with Realtime — the action-queue listener subscribes). This is
  #     what catches signature/behaviour drift in the ambient-declared bot
  #     surface (bot-live-stack.d.ts) that a pure type-check cannot: the live
  #     runner imports @somnibot/bot/dist/*.js, so a real init regression, a
  #     dropped economy_enabled gate, or a renamed export fails HERE.
  #     No real DISCORD_TOKEN is set — Discord-side readback stays gated/pending;
  #     this proves the DB-observable effect through the real wiring only.
  # ──────────────────────────────────────────────────────────────────────────
  test-live:
    name: 🛰️ Live-Stack E2E (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: install
    # Sharded 4-ways with vitest's native --shard: this was the pipeline's long
    # pole — one runner grinding the whole live suite serially for ~25-35
    # minutes while every other check finished in 2-3. Four runners each boot
    # their own local Supabase (setup is ~3.5 min of the job) and run a quarter
    # of the scenarios; coverage is identical, the wall-clock is not.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    # Real Valkey so cooldown / streak / rate-limit code paths (SET … NX) run for
    # real instead of failing closed — capabilities.redis flips on and the domain
    # proofs drive their redis-branch legs live.
    services:
      valkey:
        image: valkey/valkey:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/cache/restore@v5
        with:
          path: |
            node_modules
            packages/*/node_modules
          key: node-modules-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Supabase CLI
        run: |
          curl -fsSL -o /tmp/supabase.tar.gz \
            "https://github.com/supabase/cli/releases/download/v${SUPABASE_CLI_VERSION}/supabase_linux_amd64.tar.gz"
          tar -xzf /tmp/supabase.tar.gz -C /usr/local/bin
          supabase --version
      - name: Start Supabase local (with Realtime)
        run: |
          cd packages
          for attempt in 1 2 3; do
            if supabase start; then
              exit 0
            else
              status=$?
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "supabase start failed after ${attempt} attempts (exit ${status})"
              exit "$status"
            fi

            delay_seconds=$((attempt * 30))
            echo "supabase start failed (attempt ${attempt}/3, exit ${status}); cleaning up and retrying in ${delay_seconds}s..."
            supabase stop 2>/dev/null || true
            sleep "$delay_seconds"
          done
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      - name: Wait for Supabase REST API
        run: |
          echo "Waiting for Supabase REST API..."
          for i in $(seq 1 30); do
            if curl -sf -o /dev/null http://127.0.0.1:54321/rest/v1/ \
              -H "apikey: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU"; then
              echo "✅ Supabase REST API ready (attempt $i)"
              exit 0
            fi
            echo "  attempt $i/30 — waiting..."
            sleep 2
          done
          echo "❌ Supabase REST API did not respond within 60s"
          exit 1
      # The live runner loads the REAL compiled bot dispatcher/init, so shared +
      # bot must be built first; testkit is built to prove it compiles.
      - name: Build shared + e2e + bot + testkit
        run: |
          pnpm --filter @somnibot/shared build
          pnpm --filter @somnibot/e2e build
          pnpm --filter @somnibot/bot build
          pnpm --filter @somnibot/testkit build
      - name: Run live-stack E2E (real initGuildFeatures)
        # A1-A4 gate: every ordinary live file runs exactly once across the
        # four shards. The 46-domain A5 fleet has its own post-merge step below.
        run: >-
          pnpm --filter @somnibot/testkit test:live --reporter=verbose
          --exclude=src/__tests__/live/all-domains-scenario.live.test.ts
          --shard=${{ matrix.shard }}/4
        env:
          # Guard env for the loopback lane. live-setup.ts also force-pins the
          # safety-critical vars, but setting them here documents the contract
          # and keeps the guard satisfied even if setup ordering changes.
          # NB: NO DISCORD_TOKEN — Discord-side readback stays gated/pending.
          NODE_ENV: test
          SUPABASE_URL: http://127.0.0.1:54321
          SUPABASE_SECRET_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU
          # Real Valkey (service container above) so cooldown/streak/rate-limit legs drive.
          VALKEY_URL: redis://localhost:6379
          DISCORD_GUILD_ID: e2e-live-disposable-guild
          SOMNIBOT_E2E_DISPOSABLE_GUILD_ID: e2e-live-disposable-guild
          SOMNIBOT_LOOPBACK_E2E_CONFIRMATION: I_UNDERSTAND_THIS_MUTATES_A_DISPOSABLE_DISCORD_GUILD_AND_LOCAL_SUPABASE
          PAYPAL_ENV: sandbox
      - name: Run A5 46-domain fleet (post-merge, once)
        if: github.event_name == 'push' && matrix.shard == 1
        run: >-
          pnpm --filter @somnibot/testkit test:live --reporter=verbose
          src/__tests__/live/all-domains-scenario.live.test.ts
        env:
          NODE_ENV: test
          SUPABASE_URL: http://127.0.0.1:54321
          SUPABASE_SECRET_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU
          VALKEY_URL: redis://localhost:6379
          DISCORD_GUILD_ID: e2e-live-disposable-guild
          SOMNIBOT_E2E_DISPOSABLE_GUILD_ID: e2e-live-disposable-guild
          SOMNIBOT_LOOPBACK_E2E_CONFIRMATION: I_UNDERSTAND_THIS_MUTATES_A_DISPOSABLE_DISCORD_GUILD_AND_LOCAL_SUPABASE
          PAYPAL_ENV: sandbox
      # Dashboard route-driving lane: drives the REAL Next.js route handlers
      # in-process against the SAME local Supabase, with a REAL owner auth
      # session (zero production auth edits — only next/headers is mocked). See
      # packages/dashboard/src/__tests__/live/_session-harness.ts.
      - name: Run dashboard live-stack E2E (real route handlers + real session)
        run: >-
          pnpm --filter @somnibot/dashboard test:live --reporter=verbose
          --shard=${{ matrix.shard }}/4
        env:
          NODE_ENV: test
          SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          SUPABASE_SECRET_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU
          SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0
          VALKEY_URL: redis://localhost:6379
      - name: Stop Supabase
        if: always()
        run: cd packages && supabase stop 2>/dev/null || true

  # ──────────────────────────────────────────────────────────────────────────
  # 8. Migration Lint
  # ──────────────────────────────────────────────────────────────────────────
  migration-lint:
    name: 📋 Migration Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Lint migration files
        run: |
          set -euo pipefail
          MIGRATIONS_DIR="packages/supabase/migrations"
          ERRORS=0

          echo "=== Migration Lint ==="

          # 1. Naming convention: YYYYMMDDHHMMSS_description.sql
          for f in "$MIGRATIONS_DIR"/*.sql; do
            base=$(basename "$f")
            if ! echo "$base" | grep -qE '^[0-9]{14}_[a-z0-9_]+\.sql$'; then
              echo "❌ Bad naming: $base (expected: YYYYMMDDHHMMSS_snake_case.sql)"
              ERRORS=$((ERRORS+1))
            fi
          done

          # 2. Timestamps must be strictly ascending
          PREV=""
          for f in $(ls "$MIGRATIONS_DIR"/*.sql | sort); do
            base=$(basename "$f")
            TS=$(echo "$base" | grep -oE '^[0-9]{14}')
            if [ -n "$PREV" ] && [ "$TS" \< "$PREV" ]; then
              echo "❌ Out-of-order timestamp: $base (after $PREV)"
              ERRORS=$((ERRORS+1))
            fi
            PREV="$TS"
          done

          # 3. Timestamps must be UNIQUE.
          #
          # Supabase records applied migrations in `schema_migrations` keyed by
          # the 14-digit TIMESTAMP, not the filename. Two migrations sharing a
          # timestamp therefore cannot both be recorded, and applying the stack
          # aborts partway with:
          #
          #   ERROR: duplicate key value violates unique constraint
          #          "schema_migrations_pkey" (SQLSTATE 23505)
          #
          # Check 2 above does NOT catch this: it only fails on a DESCENDING
          # timestamp, so equal ones pass cleanly. That is exactly how three
          # concurrent branches each picked 20260727010000, went green on this
          # job, and then failed every job that boots a database.
          DUPES=$(ls "$MIGRATIONS_DIR"/*.sql | xargs -n1 basename | cut -c1-14 | sort | uniq -d)
          if [ -n "$DUPES" ]; then
            for ts in $DUPES; do
              echo "❌ Duplicate timestamp $ts — schema_migrations cannot record both:"
              ls "$MIGRATIONS_DIR"/${ts}_*.sql | xargs -n1 basename | sed 's/^/     /'
              ERRORS=$((ERRORS+1))
            done
          fi

          # 4. Dangerous operation warnings (non-blocking)
          for f in "$MIGRATIONS_DIR"/*.sql; do
            base=$(basename "$f")
            if grep -qiE '^\s*DROP\s+TABLE\b' "$f" 2>/dev/null; then
              echo "⚠️  DROP TABLE in $base"
            fi
            if grep -qiE '^\s*TRUNCATE\b' "$f" 2>/dev/null; then
              echo "⚠️  TRUNCATE in $base"
            fi
            if grep -qiE '^\s*ALTER\s+TABLE.*DROP\s+COLUMN\b' "$f" 2>/dev/null; then
              echo "⚠️  DROP COLUMN in $base"
            fi
          done

          # 5. Every new SECURITY DEFINER must have SET search_path = ''
          for f in "$MIGRATIONS_DIR"/*.sql; do
            base=$(basename "$f")
            # Find SECURITY DEFINER lines that are NOT comments
            while IFS=: read -r lineno line; do
              # Check next 3 lines for search_path
              has_sp=$(sed -n "$((lineno)),$((lineno+3))p" "$f" 2>/dev/null | grep -ci "search_path" || true)
              if [ "$has_sp" = "0" ]; then
                echo "❌ SECURITY DEFINER without SET search_path in $base:$lineno"
                ERRORS=$((ERRORS+1))
              fi
            done < <(grep -n "SECURITY DEFINER" "$f" | grep -v "^\s*--" | grep -v "ALTER FUNCTION" || true)
          done

          # Summary
          TOTAL=$(ls "$MIGRATIONS_DIR"/*.sql 2>/dev/null | wc -l)
          echo ""
          echo "Checked $TOTAL migration files, $ERRORS error(s)"

          if [ "$ERRORS" -gt 0 ]; then
            exit 1
          fi
          echo "✅ All migrations pass lint"

      # GATING: SECURITY DEFINER + SET search_path = '' bodies must schema-qualify
      # extension functions (pgcrypto/uuid-ossp). Default mode exits non-zero on
      # any unqualified extension-function reference — the exact class that caused
      # the lottery outage (gen_random_bytes() unqualified under an empty
      # search_path). Table refs are advisory-only and NOT gated here.
      - name: Lint SECURITY DEFINER search_path references
        run: python3 scripts/check-secdef-search-path.py

  # ──────────────────────────────────────────────────────────────────────────
  # 9. DB Security Audit
  #    Validates SECURITY DEFINER + RLS hardening at the SQL level.
  #    Catches regressions before they reach production.
  # ──────────────────────────────────────────────────────────────────────────
  db-security-audit:
    name: 🛡️ DB Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Supabase CLI
        run: |
          curl -fsSL -o /tmp/supabase.tar.gz \
            "https://github.com/supabase/cli/releases/download/v${SUPABASE_CLI_VERSION}/supabase_linux_amd64.tar.gz"
          tar -xzf /tmp/supabase.tar.gz -C /usr/local/bin
      - name: Start Supabase and apply migrations
        run: |
          cd packages
          for attempt in 1 2 3; do
            if supabase start; then
              exit 0
            else
              status=$?
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "supabase start failed after ${attempt} attempts (exit ${status})"
              exit "$status"
            fi

            delay_seconds=$((attempt * 30))
            echo "supabase start failed (attempt ${attempt}/3, exit ${status}); cleaning up and retrying in ${delay_seconds}s..."
            supabase stop 2>/dev/null || true
            sleep "$delay_seconds"
          done
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      - name: Wait for database
        run: |
          for i in $(seq 1 20); do
            if curl -sf -o /dev/null http://127.0.0.1:54321/rest/v1/ \
              -H "apikey: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU"; then
              echo "✅ DB ready"
              exit 0
            fi
            sleep 2
          done
          echo "❌ DB not ready"; exit 1
      - name: Audit SECURITY DEFINER functions
        run: |
          set -euo pipefail
          echo "=== SECURITY DEFINER Audit ==="

          # Query all SECURITY DEFINER functions and check for search_path
          RESULT=$(PGPASSWORD=postgres psql -h 127.0.0.1 -p 54322 -U postgres -d postgres -t -A -F'|' <<'SQL'
            SELECT p.proname,
                   n.nspname,
                   CASE WHEN p.proconfig IS NOT NULL
                        AND EXISTS (
                          SELECT 1 FROM unnest(p.proconfig) c
                          WHERE c LIKE 'search_path=%'
                        )
                   THEN 'OK'
                   ELSE 'MISSING'
                   END AS search_path_status
            FROM pg_proc p
            JOIN pg_namespace n ON n.oid = p.pronamespace
            WHERE p.prosecdef = true
              AND n.nspname = 'public'
            ORDER BY p.proname;
          SQL
          )

          ERRORS=0
          TOTAL=0

          while IFS='|' read -r name schema status; do
            [ -z "$name" ] && continue
            TOTAL=$((TOTAL+1))
            if [ "$status" = "MISSING" ]; then
              echo "❌ $schema.$name — SECURITY DEFINER without SET search_path"
              ERRORS=$((ERRORS+1))
            else
              echo "  ✓ $schema.$name"
            fi
          done <<< "$RESULT"

          echo ""
          echo "Audited $TOTAL SECURITY DEFINER functions, $ERRORS missing search_path"

          if [ "$ERRORS" -gt 0 ]; then
            echo ""
            echo "Fix: add a migration with ALTER FUNCTION <name>(<args>) SET search_path = '';"
            exit 1
          fi
          echo "✅ All SECURITY DEFINER functions have search_path set"
      - name: Audit RLS policies
        run: |
          set -euo pipefail
          echo "=== RLS Policy Audit ==="

          # Check that sensitive tables don't grant access to anon/authenticated
          # Tables that should be locked down (service_role only)
          SENSITIVE_TABLES=(
            "economy_wallets" "economy_transactions" "economy_profiles"
            "economy_inventory" "economy_items" "economy_pets"
            "economy_heists" "economy_heist_participants"
            "fraud_rules" "fraud_signals"
            "incidents" "incident_events"
            "portal_sessions" "admin_changes"
            "dashboard_roles" "dashboard_user_roles"
            "automations" "automation_executions"
            "dead_letter_queue" "workflow_events"
            "action_queue_dlq" "bot_action_queue"
            "health_metrics"
            # 20260711020000_economy_collect_role_income_atomic
            "economy_role_income_claims" "economy_role_income_requests"
            # 20260711030000_canonicalize_commerce_role_metadata
            "commerce_legacy_subscription_grant_contracts"
            "commerce_product_temp_role_config"
            "commerce_role_metadata_migration_issues"
            "commerce_temp_role_migration_issues"
            # 20260710010000_rls_pattern_sweep_lockdown — wave-2 sweep.
            # Tier 1: role-unscoped USING(true) + legacy anon grant
            "button_roles" "starboard_entries"
            "polls" "poll_options" "poll_votes"
            "predictions" "prediction_options" "prediction_bets"
            "economy_trivia_questions" "economy_lottery_drawings"
            "economy_lottery_tickets" "economy_daily_losses"
            # Tier 2: role-unscoped GUC-conditional policy + legacy anon grant
            "economy_adventures" "economy_adventure_scenes"
            "economy_adventure_sessions" "economy_fish_species"
            "economy_fish_catches" "economy_market_listings"
            "feature_embed_overrides" "tutorial_configs"
            "tutorial_steps" "tutorial_progress"
            "sync_reports" "level_unlock_configs"
            "member_feature_unlocks" "temp_role_grants"
            # Tier 3: auth-conditional policies + surviving client grants
            "active_temp_channels" "alerts" "audit_logs" "automod_rules"
            "bot_diagnostics" "channel_templates" "custom_commands"
            "customers" "discord_id_map" "embed_configs" "entitlements"
            "giveaways" "guild" "guild_config" "guild_desired_state"
            "guild_live_state" "infractions" "instance_settings"
            "level_rewards" "license_keys" "license_sessions"
            "license_validations" "member_levels" "member_rank_settings"
            "members" "message_reports" "orders" "payments" "plans"
            "product_files" "product_license_config" "products"
            "promotions" "reaction_roles" "reconciliation_runs"
            "role_templates" "scheduled_messages" "schema_migrations"
            "stats_channels" "sync_actions" "temp_channel_hubs"
            "ticket_metrics" "ticket_panels" "ticket_transcripts"
            "tickets" "users" "webhook_events" "xp_multipliers"
          )

          ERRORS=0
          for tbl in "${SENSITIVE_TABLES[@]}"; do
            # Check if anon or authenticated have any grants
            GRANTS=$(PGPASSWORD=postgres psql -h 127.0.0.1 -p 54322 -U postgres -d postgres -t -A <<SQL
              SELECT count(*)
              FROM information_schema.role_table_grants
              WHERE table_schema = 'public'
                AND table_name = '$tbl'
                AND grantee IN ('anon', 'authenticated');
          SQL
            )
            GRANTS=$(echo "$GRANTS" | tr -d ' \n')
            if [ "$GRANTS" != "0" ] && [ -n "$GRANTS" ]; then
              echo "❌ $tbl — anon/authenticated have $GRANTS grant(s) (should be revoked)"
              ERRORS=$((ERRORS+1))
            else
              echo "  ✓ $tbl — locked down"
            fi
          done

          echo ""
          if [ "$ERRORS" -gt 0 ]; then
            echo "$ERRORS table(s) have grants for anon/authenticated that should be revoked."
            echo "Fix: add REVOKE ALL ON <table> FROM anon, authenticated;"
            exit 1
          fi
          echo "✅ All sensitive tables are locked down"
      - name: Stop Supabase
        if: always()
        run: cd packages && supabase stop 2>/dev/null || true

  # ──────────────────────────────────────────────────────────────────────────
  # 10. DB Type Drift Check  (REQUIRED GATE — fails the build on drift)
  #     Regenerates the schema snapshot (packages/shared/src/types/
  #     database.generated.ts) from the SQL migrations and fails if the committed
  #     snapshot is stale. Forces a review whenever a migration changes the schema
  #     without refreshing the generated types.
  # ──────────────────────────────────────────────────────────────────────────
  type-drift:
    name: 🔄 DB Type Drift Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Fail on DB type drift
        run: |
          set -euo pipefail
          python3 scripts/test_generate_db_types.py
          # --check regenerates in memory and exits non-zero if the committed
          # snapshot differs from a fresh generation. The generator resolves the
          # migrations dir relative to itself, so no path patching is required.
          python3 scripts/generate-db-types.py --check

  # ──────────────────────────────────────────────────────────────────────────
  # 11. Security Checks
  # ──────────────────────────────────────────────────────────────────────────
  security:
    name: 🔒 Security Checks
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/cache/restore@v5
        with:
          path: |
            node_modules
            packages/*/node_modules
          key: node-modules-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Audit dependencies (high + critical)
        # pnpm crashes (Response.json parse error) when the npm registry's
        # advisory endpoint has an outage — which is an upstream incident, not
        # a finding. That crash was hard-failing every PR in the repo for as
        # long as the registry misbehaved. Retry, and distinguish the two exit
        # modes: a real vulnerability report still fails the job every time;
        # only a crashed audit (no report produced) degrades to a loud warning
        # after all retries, so an unrelated registry incident cannot freeze
        # every merge. The audit re-runs on every subsequent PR and push, so a
        # skipped window is bounded.
        run: |
          set -uo pipefail
          # Crash-vs-report detection must be STRUCTURAL: pnpm's own deprecation
          # warning contains the word "vulnerabilities", so any text match
          # misclassifies a registry-outage crash as a real finding. A report
          # is JSON that parses; anything else is a crash.
          for attempt in 1 2 3 4; do
            # GitHub runs steps with implicit `bash -e`: without `|| true`, a
            # failing pnpm inside the command substitution kills the whole step
            # instantly and silently (stderr is already discarded).
            out="$(pnpm audit --audit-level=high --json 2>/dev/null || true)"
            # Count NAMED advisories, not metadata totals: pnpm's metadata
            # includes phantom entries (aliases of already-reviewed ignored
            # GHSAs) that appear in no advisory list and no table, and cannot
            # be acted on. A named high/critical advisory always fails; a
            # metadata-only discrepancy warns loudly instead of blocking.
            verdict="$(node -e '
              try {
                const a = JSON.parse(process.argv[1]);
                const named = Object.values(a.advisories || {})
                  .filter((x) => x.severity === "high" || x.severity === "critical").length;
                const v = (a.metadata && a.metadata.vulnerabilities) || {};
                const meta = (v.high || 0) + (v.critical || 0);
                if (named > 0) console.log("VULNS:" + named);
                else if (meta > 0) console.log("PHANTOM:" + meta);
                else console.log("CLEAN");
              } catch { console.log("CRASH"); }
            ' "$out" 2>/dev/null || echo CRASH)"
            case "$verdict" in
              CLEAN)
                echo "audit clean (attempt $attempt)"
                exit 0 ;;
              VULNS:*)
                echo "$out"
                echo "::error::Dependency audit found ${verdict#VULNS:} named high/critical advisories"
                exit 1 ;;
              PHANTOM:*)
                echo "::warning::Audit metadata counts ${verdict#PHANTOM:} high/critical finding(s) with NO named advisory — likely registry aliases of reviewed+ignored GHSAs. Review pnpm audit manually if this persists."
                exit 0 ;;
              *)
                echo "audit produced no parseable report (attempt $attempt/4) — registry issue, retrying in $((attempt*15))s" ;;
            esac
            sleep $((attempt*15))
          done
          echo "::warning::pnpm audit could not obtain a report after 4 attempts — upstream registry outage, not a clean audit. Re-verified automatically on the next run."
          exit 0
      - name: Scan for hardcoded secrets
        run: |
          set -euo pipefail
          echo "=== Secret Scan ==="

          PATTERNS=(
            'sk_live_'
            'sk_test_'
            'PAYPAL_CLIENT_SECRET\s*=\s*["'\''"][A-Za-z0-9]'
            'ghp_[A-Za-z0-9]{36}'
            'xoxb-[0-9]'
            'AKIA[0-9A-Z]{16}'
            'glpat-[A-Za-z0-9_-]{20}'
          )

          FOUND=0
          for pattern in "${PATTERNS[@]}"; do
            MATCHES=$(grep -rn "$pattern" \
              --include="*.ts" --include="*.tsx" --include="*.js" --include="*.env" \
              --exclude-dir=node_modules --exclude-dir=.git --exclude-dir=dist \
              --exclude=".env.example" --exclude="ci.yml" . 2>/dev/null || true)
            if [ -n "$MATCHES" ]; then
              echo "⚠️  Possible secret matching: $pattern"
              echo "$MATCHES" | head -3
              FOUND=$((FOUND+1))
            fi
          done

          if [ "$FOUND" -gt 0 ]; then
            echo "❌ Found $FOUND potential secret pattern(s)"
            exit 1
          fi
          echo "✅ No hardcoded secrets detected"
      - name: Check for unsafe patterns
        run: |
          set -euo pipefail
          echo "=== Unsafe Pattern Scan ==="
          ERRORS=0

          # eval() usage (excluding node_modules, tests, configs)
          EVAL_HITS=$(grep -rn '\beval(' \
            --include="*.ts" --include="*.tsx" \
            --exclude-dir=node_modules --exclude-dir=.git --exclude-dir=dist \
            --exclude="*.test.ts" --exclude="*.config.*" \
            packages/ 2>/dev/null || true)
          if [ -n "$EVAL_HITS" ]; then
            echo "⚠️  eval() usage found:"
            echo "$EVAL_HITS"
            ERRORS=$((ERRORS+1))
          fi

          # dangerouslySetInnerHTML (only flag new instances)
          DSHI_HITS=$(grep -rn 'dangerouslySetInnerHTML' \
            --include="*.tsx" \
            --exclude-dir=node_modules --exclude-dir=.git --exclude-dir=dist \
            packages/ 2>/dev/null || true)
          if [ -n "$DSHI_HITS" ]; then
            echo "⚠️  dangerouslySetInnerHTML usage (verify XSS safety):"
            echo "$DSHI_HITS"
            # Non-blocking — just flag for review
          fi

          if [ "$ERRORS" -gt 0 ]; then
            echo "❌ Unsafe patterns detected"
            exit 1
          fi
          echo "✅ No unsafe patterns detected"

  # ──────────────────────────────────────────────────────────────────────────
  # 12. CI Gate — required status check for branch protection
  #     Every job above must pass. Add this single job as the required
  #     status check in GitHub repo settings instead of listing each job.
  # ──────────────────────────────────────────────────────────────────────────
  ci-gate:
    name: ✅ CI Gate
    runs-on: ubuntu-latest
    if: always()
    needs:
      - install
      - typecheck
      - lint
      - build
      - test-unit
      - test-dashboard
      - test-shared
      - test-launcher
      - test-e2e-contract
      - test-testkit
      - test-integration
      - test-live
      - migration-lint
      - db-security-audit
      - type-drift
      - security
    steps:
      - name: Check all jobs passed
        run: |
          echo "Job results:"
          echo "  install:           ${{ needs.install.result }}"
          echo "  typecheck:         ${{ needs.typecheck.result }}"
          echo "  lint:              ${{ needs.lint.result }}"
          echo "  build:             ${{ needs.build.result }}"
          echo "  test-unit:         ${{ needs.test-unit.result }}"
          echo "  test-dashboard:    ${{ needs.test-dashboard.result }}"
          echo "  test-shared:       ${{ needs.test-shared.result }}"
          echo "  test-launcher:     ${{ needs.test-launcher.result }}"
          echo "  test-e2e-contract: ${{ needs.test-e2e-contract.result }}"
          echo "  test-testkit:      ${{ needs.test-testkit.result }}"
          echo "  test-integration:  ${{ needs.test-integration.result }}"
          echo "  test-live:         ${{ needs.test-live.result }}"
          echo "  migration-lint:    ${{ needs.migration-lint.result }}"
          echo "  db-security-audit: ${{ needs.db-security-audit.result }}"
          echo "  type-drift:        ${{ needs.type-drift.result }}"
          echo "  security:          ${{ needs.security.result }}"

          # Every job below is a required gate and must succeed (type-drift is now
          # fail-on-drift, no longer warn-only).
          FAILED=0
          for result in \
            "${{ needs.install.result }}" \
            "${{ needs.typecheck.result }}" \
            "${{ needs.lint.result }}" \
            "${{ needs.build.result }}" \
            "${{ needs.test-unit.result }}" \
            "${{ needs.test-dashboard.result }}" \
            "${{ needs.test-shared.result }}" \
            "${{ needs.test-launcher.result }}" \
            "${{ needs.test-e2e-contract.result }}" \
            "${{ needs.test-testkit.result }}" \
            "${{ needs.test-integration.result }}" \
            "${{ needs.test-live.result }}" \
            "${{ needs.migration-lint.result }}" \
            "${{ needs.db-security-audit.result }}" \
            "${{ needs.type-drift.result }}" \
            "${{ needs.security.result }}"; do
            if [ "$result" != "success" ]; then
              FAILED=$((FAILED+1))
            fi
          done

          if [ "$FAILED" -gt 0 ]; then
            echo ""
            echo "❌ $FAILED required job(s) did not succeed"
            exit 1
          fi

          echo ""
          echo "✅ All required jobs passed"
