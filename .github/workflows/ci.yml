name: CI
​
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
​
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
​
env:
  NODE_VERSION: '22'
​
jobs:
  # ──────────────────────────────────────────────────────────
  # Install & Cache
  # ──────────────────────────────────────────────────────────
  install:
    name: Install Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache/save@v4
        with:
          path: |
            node_modules
            packages/*/node_modules
          key: node-modules-${{ hashFiles('pnpm-lock.yaml') }}
​
  # ──────────────────────────────────────────────────────────
  # Typecheck — all packages
  # ──────────────────────────────────────────────────────────
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            packages/*/node_modules
          key: node-modules-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Build shared (dependency for others)
        run: pnpm --filter @somnibot/shared build
      - name: Typecheck bot
        run: pnpm --filter @somnibot/bot type-check
      - name: Typecheck dashboard
        run: pnpm --filter @somnibot/dashboard type-check
      - name: Typecheck license-sdk
        run: pnpm --filter @somnibot/license-sdk typecheck
​
  # ──────────────────────────────────────────────────────────
  # Lint
  # ──────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            packages/*/node_modules
          key: node-modules-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Build shared
        run: pnpm --filter @somnibot/shared build
      - name: Lint dashboard
        run: pnpm --filter @somnibot/dashboard lint
  # ──────────────────────────────────────────────────────────
  # Build — full production build
  # ──────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            packages/*/node_modules
          key: node-modules-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Build all packages
        run: pnpm build
        env:
          # Dummy env vars for Next.js build (not real credentials)
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.placeholder
          DISCORD_GUILD_ID: '000000000000000000'
​
  # ──────────────────────────────────────────────────────────
  # Unit Tests — vitest
  # ──────────────────────────────────────────────────────────
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            packages/*/node_modules
          key: node-modules-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Build shared
        run: pnpm --filter @somnibot/shared build
      - name: Run tests
        run: pnpm --filter @somnibot/bot test -- --coverage --coverage.thresholds.statements=60 --reporter=verbose
​
  # ──────────────────────────────────────────────────────────
  # Integration Tests — real Supabase
  # ──────────────────────────────────────────────────────────
  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            packages/*/node_modules
          key: node-modules-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Supabase CLI
        run: |
          curl -fsSL -o /tmp/supabase.tar.gz https://github.com/supabase/cli/releases/download/v2.101.0/supabase_linux_amd64.tar.gz && tar -xzf /tmp/supabase.tar.gz -C /usr/local/bin supabase
      - name: Start Supabase local
        run: |
          cd packages
          supabase start --ignore-health-check
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      - name: Build shared
        run: pnpm --filter @somnibot/shared build
      - name: Run integration tests
        run: pnpm --filter @somnibot/bot test:integration -- --reporter=verbose
        env:
          SUPABASE_URL: http://127.0.0.1:54321
          SUPABASE_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU
      - name: Stop Supabase
        if: always()
        run: cd packages && supabase stop 2>/dev/null || true
​
  # ──────────────────────────────────────────────────────────
  # Migration Lint
  # ──────────────────────────────────────────────────────────
  migration-lint:
    name: Migration Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check migration file conventions
        run: |
          set -euo pipefail
          MIGRATIONS_DIR="packages/supabase/migrations"
          ERRORS=0
​
          echo "=== Migration Lint ==="
​
          # Check all files follow naming convention: YYYYMMDDHHMMSS_description.sql
          for f in "$MIGRATIONS_DIR"/*.sql; do
            base=$(basename "$f")
            if ! echo "$base" | grep -qE '^[0-9]{14}_[a-z0-9_]+\.sql$'; then
              echo "❌ Bad naming convention: $base (expected: YYYYMMDDHHMMSS_snake_case.sql)"
              ERRORS=$((ERRORS+1))
            fi
          done
​
          # Check timestamps are in order
          PREV=""
          for f in $(ls "$MIGRATIONS_DIR"/*.sql | sort); do
            base=$(basename "$f")
            TS=$(echo "$base" | grep -oE '^[0-9]{14}')
            if [ -n "$PREV" ] && [ "$TS" \< "$PREV" ]; then
              echo "❌ Out-of-order timestamp: $base (after $PREV)"
              ERRORS=$((ERRORS+1))
            fi
            PREV="$TS"
          done
​
          # Warn on dangerous operations
          for f in "$MIGRATIONS_DIR"/*.sql; do
            base=$(basename "$f")
            if grep -qiE '^\s*DROP\s+TABLE\b' "$f" 2>/dev/null; then
              echo "⚠️  DROP TABLE found in $base — ensure this is intentional"
            fi
            if grep -qiE '^\s*TRUNCATE\b' "$f" 2>/dev/null; then
              echo "⚠️  TRUNCATE found in $base — ensure this is intentional"
            fi
            if grep -qiE '^\s*DELETE\s+FROM\b' "$f" 2>/dev/null && ! grep -qiE 'WHERE' "$f" 2>/dev/null; then
              echo "⚠️  DELETE without WHERE in $base — ensure this is intentional"
            fi
          done
​
          # Summary
          TOTAL=$(ls "$MIGRATIONS_DIR"/*.sql 2>/dev/null | wc -l)
          echo ""
          echo "Checked $TOTAL migration files, $ERRORS error(s)"
​
          if [ "$ERRORS" -gt 0 ]; then
            exit 1
          fi
          echo "✅ All migrations pass lint"
​
  # ──────────────────────────────────────────────────────────
  # Security Checks
  # ──────────────────────────────────────────────────────────
  security:
    name: Security Checks
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            packages/*/node_modules
          key: node-modules-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Audit dependencies
        run: pnpm audit --audit-level=high || true  # Don't block on moderate
      - name: Check for hardcoded secrets
        run: |
          set -euo pipefail
          echo "=== Checking for hardcoded secrets ==="
​
          # Patterns that suggest real credentials
          PATTERNS=(
            'sk_live_'
            'sk_test_'
            'PAYPAL_CLIENT_SECRET\s*=\s*["\x27][A-Za-z0-9]'
            'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9\.[A-Za-z0-9_-]{20,}'
            'ghp_[A-Za-z0-9]{36}'
            'xoxb-[0-9]'
          )
​
          FOUND=0
          for pattern in "${PATTERNS[@]}"; do
            MATCHES=$(grep -rn "$pattern" --include="*.ts" --include="*.tsx" --include="*.js" --include="*.env" \
              --exclude-dir=node_modules --exclude-dir=.git --exclude-dir=dist \
              --exclude=".env.example" --exclude="ci.yml" . 2>/dev/null || true)
            if [ -n "$MATCHES" ]; then
              echo "⚠️  Possible secret found matching pattern: $pattern"
              echo "$MATCHES" | head -3
              FOUND=$((FOUND+1))
            fi
          done
​
          if [ "$FOUND" -gt 0 ]; then
            echo "❌ Found $FOUND potential secret pattern(s) — review above"
            exit 1
          fi
          echo "✅ No hardcoded secrets detected"