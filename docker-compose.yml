services:
  lavalink:
    image: ghcr.io/lavalink-devs/lavalink:4
    container_name: somni-lavalink
    restart: unless-stopped
    ports:
      - "127.0.0.1:2333:2333"
    volumes:
      - ./services/lavalink/application.yml:/opt/Lavalink/application.yml
    environment:
      - _JAVA_OPTIONS=-Xmx512m
      - LAVALINK_PASSWORD=${LAVALINK_PASSWORD:?Set LAVALINK_PASSWORD in .env}

  valkey:
    image: valkey/valkey:7.2-alpine
    container_name: somni-valkey
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - valkey-data:/data
    command: valkey-server --save 60 1 --loglevel warning --requirepass ${VALKEY_PASSWORD:-}

volumes:
  valkey-data:
