# Standalone Docker services for cloud / self-hosted deploys.
# The Electron launcher manages its own Lavalink + Valkey instances;
# this file is for Railway / Docker Compose deployments only.
services:
  lavalink:
    image: ghcr.io/lavalink-devs/lavalink:4.0
    container_name: somni-lavalink
    restart: unless-stopped
    ports:
      - "127.0.0.1:2333:2333"
    volumes:
      - ./services/lavalink/application.yml:/opt/Lavalink/application.yml
    environment:
      - _JAVA_OPTIONS=-Xmx512m
      - LAVALINK_PASSWORD=${LAVALINK_PASSWORD:?Set LAVALINK_PASSWORD in .env}

  valkey:
    image: valkey/valkey:7.2-alpine
    container_name: somni-valkey
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - valkey-data:/data
    # When VALKEY_PASSWORD is set, pass --requirepass; otherwise run without auth.
    # The bot/dashboard VALKEY_URL must include the password if set:
    #   VALKEY_URL=redis://:yourpassword@127.0.0.1:6379
    # NOTE: Set VALKEY_PASSWORD in .env even in dev so auth-related bugs
    # surface locally rather than only in production (Finding #14).
    command: >-
      valkey-server
      --save 60 1
      --loglevel warning
      ${VALKEY_PASSWORD:+--requirepass ${VALKEY_PASSWORD}}

volumes:
  valkey-data:
