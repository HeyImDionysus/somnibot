openapi: '3.1.0'
info:
  title: SomniBot Dashboard API
  version: '1.0.0'
  description: |
    Internal API for the SomniBot dashboard. All routes require guild-owner
    authentication via Discord OAuth session unless noted otherwise.

    **Authentication**: Discord OAuth2 session cookie (managed by NextAuth).
    Most endpoints also require `X-Guild-ID` header or derive guild from session.
  contact:
    email: heyimdionysus@gmail.com

servers:
  - url: '{dashboardUrl}'
    description: Dashboard instance
    variables:
      dashboardUrl:
        default: 'http://localhost:3000'

security:
  - sessionCookie: []

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: next-auth.session-token
      description: NextAuth session cookie from Discord OAuth

  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
        details:
          type: array
          items:
            type: object
            properties:
              path:
                type: string
              message:
                type: string

    PaginatedResponse:
      type: object
      properties:
        data:
          type: array
          items: {}
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer

