server:
  port: 2333
  address: 0.0.0.0

lavalink:
  server:
    password: "${LAVALINK_PASSWORD}"
    sources:
      youtube: false     # Disabled — using plugin
      bandcamp: true
      soundcloud: true
      twitch: true
      vimeo: true
      http: false  # V6 Audit §2.1: disable arbitrary HTTP source to prevent SSRF
      local: false
    filters:
      volume: true
      equalizer: true
      karaoke: false
      timescale: true
      tremolo: false
      vibrato: false
      distortion: false
      rotation: true
      channelMix: false
      lowPass: false
    bufferDurationMs: 400
    frameBufferDurationMs: 5000
    youtubePlaylistLoadLimit: 6
    playerUpdateInterval: 5
    youtubeSearchEnabled: true
    soundcloudSearchEnabled: true
    gc-warnings: true

  plugins:
    - dependency: "dev.lavalink.youtube:youtube-plugin:1.17.0"
      snapshot: false

plugins:
  youtube:
    enabled: true
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true
    clients:
      - MUSIC
      - ANDROID_VR
      - WEB
      - WEBEMBEDDED
      - TVHTML5EMBEDDED
    oauth:
      # OFF by default: with `enabled: true` and no refreshToken the plugin
      # polls Google for a token it will never get and logs a 400 every few
      # seconds forever. Playback works fine without it via the clients above.
      # To enable: set `enabled: true`, restart, then read the device code from
      # `docker logs somni-lavalink` ("go to https://www.google.com/device and
      # enter code XXX-XXX-XXX"), authorise it, and paste the refresh token the
      # plugin then logs into `refreshToken` below. OAuth mainly helps with
      # age-restricted tracks and YouTube bot-detection.
      enabled: false
      # refreshToken: ""

logging:
  file:
    max-history: 30
    max-size: 1GB
  path: ./logs/

  level:
    root: INFO
    lavalink: INFO
