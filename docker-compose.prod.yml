services:
  bot:
    build:
      context: .
      dockerfile: packages/bot/Dockerfile
    restart: unless-stopped
    depends_on:
      lavalink:
        condition: service_healthy
      valkey:
        condition: service_healthy
    env_file: .env
    # V5 Audit §4.P2 — memory/CPU limits prevent runaway processes
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: '1.5'
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  dashboard:
    build:
      context: .
      dockerfile: packages/dashboard/Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?Set NEXT_PUBLIC_APP_URL in .env}
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:?Set NEXT_PUBLIC_SUPABASE_URL in .env}
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:?Set NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY in .env}
    restart: unless-stopped
    depends_on:
      valkey:
        condition: service_healthy
    env_file: .env
    # V5 Audit §4.P2 — memory/CPU limits prevent runaway processes
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: '1.0'
    healthcheck:
      test: ["CMD-SHELL", "node -e \"const { hostname } = require('node:os'); fetch('http://' + hostname() + ':3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  caddy:
    image: caddy:2.9-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./services/caddy/Caddyfile:/etc/caddy/Caddyfile
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      dashboard:
        condition: service_healthy

  lavalink:
    image: ghcr.io/lavalink-devs/lavalink:4.0
    restart: unless-stopped
    volumes:
      - ./services/lavalink/application.yml:/opt/Lavalink/application.yml
      # V5 Audit P3-9: Persist Lavalink logs across container restarts
      - lavalink-logs:/opt/Lavalink/logs
    environment:
      - _JAVA_OPTIONS=-Xmx512m
      - LAVALINK_PASSWORD=${LAVALINK_PASSWORD:?Set LAVALINK_PASSWORD in .env}
    # V5 Audit §4.P2 — hard container limit matches JVM -Xmx plus headroom
    deploy:
      resources:
        limits:
          memory: 768m
          cpus: '1.0'
    healthcheck:
      test: ["CMD-SHELL", "wget -q --header=\"Authorization: $${LAVALINK_PASSWORD}\" --spider http://localhost:2333/version || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  valkey:
    image: valkey/valkey:7.2-alpine
    restart: unless-stopped
    volumes:
      - valkey-data:/data
    command: valkey-server --save 60 1 --loglevel warning --requirepass ${VALKEY_PASSWORD:?Set VALKEY_PASSWORD in .env}
    # V8 Audit §9.P3b: Use REDISCLI_AUTH env var so password doesn't appear in docker inspect
    environment:
      - REDISCLI_AUTH=${VALKEY_PASSWORD}
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  valkey-data:
  caddy-data:
  caddy-config:
  lavalink-logs:
